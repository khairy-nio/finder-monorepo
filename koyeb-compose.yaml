name: finder-backend
services:
  - name: api
    type: web
    git:
      repository: github.com/khairy-nio/finder-monorepo
      branch: deployment-restructure
      workdir: backend-service
      buildpack:
        build_command: npm install
        run_command: npm start
    ports:
      - number: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    checks:
      - type: http
        port: 8000
        path: /health
        method: GET
    instance_type: free
    regions:
      - was
    scaling:
      min: 0
      max: 1
    env:
      - key: NODE_ENV
        value: production
      # --- Set the following in the Koyeb dashboard (Secrets) after account creation ---
      # - key: DATABASE_URL
      #   value: <your-postgresql-connection-string>
      # - key: AI_SERVICE_URL
      #   value: <your-ai-service-url>
      # - key: PINECONE_API_KEY
      #   value: <your-pinecone-api-key>
      # - key: CLOUDINARY_CLOUD_NAME
      #   value: <your-cloudinary-cloud-name>
      # - key: CLOUDINARY_API_KEY
      #   value: <your-cloudinary-api-key>
      # - key: CLOUDINARY_API_SECRET
      #   value: <your-cloudinary-api-secret>
      # - key: FIREBASE_SERVICE_ACCOUNT
      #   value: <full-service-account-json-as-single-line-string>
      # - key: CORS_ORIGINS
      #   value: <your-admin-dashboard-url>
      # - key: FRONTEND_URL
      #   value: <your-admin-dashboard-url>
